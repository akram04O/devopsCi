with:
name: Test Calculator
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  jobs:
    test:
    runs-on: ubuntu-latest
    steps:
    name: checkout code
    uses: action/ckeckout@v4

    name: set up python
    uses: actions/setup-python@v4
    with:
      python-version: 3.14

    name: install pytest
    run: pip install pytest
    name: run tests
    run: pytest
    